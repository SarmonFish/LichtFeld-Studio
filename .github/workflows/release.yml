name: Manual Build

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: '发布通道'
        required: true
        type: choice
        default: 'nightly'
        options:
          - nightly
          - stable
      stable_version:
        description: '稳定版本号（仅 stable 通道需要）'
        required: false
        type: string

env:
  UPSTREAM_REPO: MrNeRF/LichtFeld-Studio
  PACKAGE_PREFIX: LichtFeld-Studio-windows-v

jobs:
  build-and-package:
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BUILD_TYPE: release

    steps:
      # ---- 根据输入决定 checkout 哪个版本 ----
      - name: Prepare build ref
        id: ref
        shell: pwsh
        run: |
          $channel = "${{ github.event.inputs.release_channel }}"
          if ($channel -eq "stable") {
            $version = "${{ github.event.inputs.stable_version }}".Trim()
            if ([string]::IsNullOrWhiteSpace($version)) {
              throw "稳定版发布必须提供版本号（例如 0.5.3）"
            }
            $ref = "v$version"
            echo "build_channel=stable" >> $env:GITHUB_OUTPUT
          } else {
            # nightly 通道：使用上游 master 分支（也可以改为 dev 或其他）
            $ref = "master"
            echo "build_channel=nightly" >> $env:GITHUB_OUTPUT
          }
          echo "checkout_ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.ref.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      # ---- CUDA ----
      - name: Install CUDA 12.8
        run: |
          cd ..
          Invoke-WebRequest https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_571.96_windows.exe -OutFile cuda.exe -Verbose
          Start-Process -FilePath .\cuda.exe -ArgumentList "-y -s -accepteula -toolkit -override -noDisplayDriver" -Wait

      - name: Set CUDA environment
        run: |
          echo "CUDA_PATH_V12_8=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ---- vcpkg ----
      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-tool-${{ runner.os }}-2026-03-12
          restore-keys: vcpkg-tool-${{ runner.os }}-

      - name: Setup vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure vcpkg triplet
        run: |
          Add-Content -Path "$env:VCPKG_ROOT\triplets\x64-windows.cmake" -Value "set(VCPKG_MAX_CONCURRENCY 2)"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-pkgs-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: vcpkg-pkgs-${{ runner.os }}-

      # ---- 配置（带重试） ----
      - name: Configure (with retry)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmakeArgs = '-B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PORTABLE=ON -DBUILD_PYTHON_STUBS=OFF'
          $retryablePatterns = @(
            'status code 5\d\d',
            'timed out',
            'timeout',
            'connection reset',
            'failed to connect',
            'temporarily unavailable',
            'tls',
            'ssl'
          )

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Configure attempt $attempt/3"
            cmd /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && cmake $cmakeArgs"

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            $shouldRetry = $false
            if (Test-Path 'build\vcpkg-manifest-install.log') {
              foreach ($pattern in $retryablePatterns) {
                if (Select-String -Path 'build\vcpkg-manifest-install.log' -Pattern $pattern -Quiet) {
                  $shouldRetry = $true
                  break
                }
              }
            }

            if (-not $shouldRetry -or $attempt -eq 3) {
              exit $LASTEXITCODE
            }

            Write-Warning "Retryable configure failure detected, cleaning build tree before retry."
            if (Test-Path 'build') {
              Remove-Item -Recurse -Force 'build'
            }
            Start-Sleep -Seconds (15 * $attempt)
          }

      # ---- 编译 ----
      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build -j %NUMBER_OF_PROCESSORS%

      # ---- 打包 ----
      - name: Package
        id: package
        shell: pwsh
        run: |
          $shortSha = (git rev-parse --short HEAD).Trim()
          $dateStamp = Get-Date -AsUTC -Format "yyyyMMdd"
          $channel = "${{ steps.ref.outputs.build_channel }}"

          if ($channel -eq "stable") {
            $packageVersion = "${{ github.event.inputs.stable_version }}".Trim()
          } else {
            $packageVersion = "0.0.0.dev$dateStamp+$shortSha"
          }

          $packageName = "${env:PACKAGE_PREFIX}${packageVersion}.zip"

          cmake --install build --prefix dist
          Compress-Archive -Path dist\* -DestinationPath $packageName

          echo "package_name=$packageName" >> $env:GITHUB_OUTPUT
          echo "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          echo "build_channel=$channel" >> $env:GITHUB_OUTPUT

      # ---- 上传 Artifact ----
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LichtFeld-Studio-${{ steps.package.outputs.package_version }}-windows-${{ steps.package.outputs.build_channel }}
          path: ${{ steps.package.outputs.package_name }}
          retention-days: 90
